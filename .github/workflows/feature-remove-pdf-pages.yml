name: Apply PDF page removal feature

on:
  push:
    branches: [feature/remove-pdf-pages]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/remove-pdf-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply feature patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = '''  function removePhotoPage(pageId: string) {
            const page = pages.find(candidate => candidate.id === pageId);
            if (!page || page.kind !== 'photo') return;
            URL.revokeObjectURL(page.previewUrl);
            setPages(current => current.filter(candidate => candidate.id !== pageId));
            markEdited();
            setStatus(`Photo page ${page.filename} removed.`);
          }'''
          new = '''  function removePage(pageId: string) {
            const page = pages.find(candidate => candidate.id === pageId);
            if (!page) return;
            if (pages.length === 1) {
              setStatus('A document needs at least one page. Replace the document instead.');
              return;
            }
            URL.revokeObjectURL(page.previewUrl);
            setPages(current => current.filter(candidate => candidate.id !== pageId));
            if (annotationPageId === pageId) setAnnotationPageId(null);
            markEdited();
            const remaining = pages.length - 1;
            setStatus(`Page ${page.filename} removed. ${remaining} page${remaining === 1 ? '' : 's'} remaining.`);
          }'''
          if old in s:
              s = s.replace(old, new)
          elif 'function removePage(pageId: string)' not in s:
              raise SystemExit('Could not find page removal function')

          s = s.replace(
              '            <p>Drag pages into position. The arrow buttons remain available as a keyboard-friendly fallback.</p>',
              '            <p>Drag pages into position, remove pages you do not want to publish, or use the arrow buttons as a keyboard-friendly fallback.</p>',
          )
          old_actions = '''                      {standalonePhoto ? (
                        <button type="button" className="dangerButton" onClick={() => removePhotoPage(page.id)} disabled={controlsDisabled}>Remove photo</button>
                      ) : (
                        <button type="button" onClick={() => setAnnotationPageId(page.id)} disabled={controlsDisabled}>Annotate</button>
                      )}'''
          new_actions = '''                      {!standalonePhoto && (
                        <button type="button" onClick={() => setAnnotationPageId(page.id)} disabled={controlsDisabled}>Annotate</button>
                      )}
                      <button
                        type="button"
                        className="dangerButton"
                        onClick={() => removePage(page.id)}
                        disabled={controlsDisabled || pages.length === 1}
                        aria-label={`Remove page ${index + 1}`}
                        title={pages.length === 1 ? 'A document needs at least one page' : 'Remove this page from the document'}
                      >Remove page</button>'''
          if old_actions in s:
              s = s.replace(old_actions, new_actions)
          elif 'onClick={() => removePage(page.id)}' not in s:
              raise SystemExit('Could not find page action controls')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit feature
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "Feature already applied."
            exit 0
          fi
          git commit -m "feat: allow removing imported PDF pages"
          git push
