<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/brand/drawing-hand.png?v=2" type="image/png" />
  <title>Elijah's Judging Desk · Drawing Hand</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#20201e;background:#f3efe6}*{box-sizing:border-box}body{margin:0}.shell{width:min(1050px,calc(100% - 32px));margin:auto;padding:48px 0 72px}a{color:inherit}.back{font-weight:750}.eyebrow{margin:42px 0 10px;text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:800}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.04em}h1{font-size:clamp(3rem,9vw,6rem);line-height:.9;margin:0}h2{font-size:clamp(1.8rem,5vw,2.8rem);margin:.2em 0}.lede{max-width:720px;font-size:1.16rem;line-height:1.55;color:#625d54}.card{margin-top:28px;padding:24px;border:1px solid rgba(32,32,30,.14);border-radius:20px;background:rgba(255,255,255,.65)}.login{max-width:600px}.fields{display:grid;gap:14px;margin:18px 0}.fields label{display:grid;gap:6px;font-weight:750}.fields input,.fields select,.fields textarea{width:100%;padding:11px 12px;border:1px solid rgba(32,32,30,.2);border-radius:10px;background:#fff;color:#20201e;font:inherit}.fields textarea{min-height:90px;resize:vertical}.button,button{display:inline-block;padding:12px 17px;border:0;border-radius:999px;background:#20201e;color:#fff;text-decoration:none;font:inherit;font-weight:800;cursor:pointer}.status,.note{font-size:.9rem;color:#777168;line-height:1.5}.status[data-error="true"]{color:#a12b2b}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.image-box{margin:0}.image-box figcaption{font-weight:800;margin-bottom:8px}.image-box img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:14px;background:#fff;border:1px solid rgba(32,32,30,.1)}.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(32,32,30,.08);font-size:.82rem;font-weight:800}.judged{opacity:.72}.check{display:flex!important;grid-template-columns:auto 1fr!important;align-items:center;gap:10px!important}.check input{width:auto!important}.empty{padding:30px;text-align:center}.result-link{margin-left:10px;font-size:.9rem}@media(max-width:700px){.entry-grid{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{color:#f1ede5;background:#191816}.lede,.status,.note{color:#bbb3a7}.card{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.12)}.button,button{background:#f1ede5;color:#191816}.fields input,.fields select,.fields textarea{background:#25231f;color:#f1ede5;border-color:rgba(255,255,255,.18)}.image-box img{background:#25231f;border-color:rgba(255,255,255,.12)}.pill{background:rgba(255,255,255,.1)}}
  </style>
</head>
<body><main class="shell">
  <a class="back" href="/drawing/?admin=1">← Drawing Hand</a>
  <p class="eyebrow">Drawing Hand</p>
  <h1>Elijah's<br>Judging Desk</h1>
  <p class="lede">See each submitted drawing beside the original challenge, give it a score out of 10, choose the final grade, and send the result back through the entrant's private result link.</p>

  <section id="login-card" class="card login">
    <h2>Open the desk</h2>
    <form id="login-form">
      <div class="fields"><label>Admin key<input name="adminKey" type="password" autocomplete="off" required /></label></div>
      <button type="submit">Open Judging Desk</button>
      <p id="login-status" class="status" aria-live="polite"></p>
    </form>
  </section>

  <section id="desk" hidden>
    <p id="desk-status" class="status" aria-live="polite"></p>
    <div id="entries"></div>
  </section>
</main>
<script type="module" src="/drawing/judge/main.ts"></script>
</body>
</html>
