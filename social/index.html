<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#839a42" />
    <meta name="description" content="Dent Hand — a minimal federated Micro.blog client for timelines, replies, bookmarks and dents." />
    <meta name="application-name" content="Dent Hand" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dent Hand" />
    <link rel="manifest" href="/dent-hand.webmanifest" />
    <link rel="icon" href="/dent-hand-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/dent-hand-icon.svg" />
    <title>Dent Hand — Helping Hand</title>
    <style>
      .my-posts-shortcut{position:absolute;z-index:6;top:34px;left:max(138px,calc((100vw - 1060px)/2 + 130px));color:#dce5bd;text-decoration:none;font:750 .88rem/1 system-ui,sans-serif;border-left:1px solid #58613f;padding-left:14px}
      .my-posts-shortcut:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
      .my-posts-shortcut:focus-visible{outline:3px solid #8ca6e8;outline-offset:4px}
      @media(max-width:760px){.my-posts-shortcut{top:28px;left:126px}}
    </style>
  </head>
  <body>
    <a class="my-posts-shortcut" href="/social/my-posts/">My posts</a>
    <div id="social-root"></div>
    <script type="module" src="/social/main.tsx"></script>
  </body>
</html>
